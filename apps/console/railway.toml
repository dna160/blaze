# Railway service config for apps/console. Config File Path in the
# dashboard: apps/console/railway.toml. Root directory stays the repo root.

[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/console.Dockerfile"
# Deploy triggers. Railway's default for a monorepo service is its own app
# directory alone, which is wrong here: the console compiles @rentos/contracts into its bundle, so a contracts
# change must rebuild it. Leaving it narrow is how a
# shared-package change silently fails to reach a service — the drift class
# that took production down on 2026-08-23.
watchPatterns = ["/apps/console/**", "/packages/**", "/infra/docker/**", "/pnpm-lock.yaml"]

[deploy]
healthcheckPath = "/login"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# NEXT_PUBLIC_API_URL and NEXT_PUBLIC_TENANT_SLUG are compiled into the
# client bundle at BUILD time — set them as Railway "Build Variables" on
# this service. Console v1 is one deployment per tenant (see
# apps/console/src/lib/api.ts) — a second tenant onboarding gets its own
# console service pointed at its own NEXT_PUBLIC_TENANT_SLUG.
