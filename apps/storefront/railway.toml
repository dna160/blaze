# Railway service config for apps/storefront. Config File Path in the
# dashboard: apps/storefront/railway.toml. Root directory stays the repo root.

[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/storefront.Dockerfile"
# Deploy triggers. Railway's default for a monorepo service is its own app
# directory alone, which is wrong here: the storefront compiles @rentos/contracts into its bundle, so a contracts
# change must rebuild it. Leaving it narrow is how a
# shared-package change silently fails to reach a service — the drift class
# that took production down on 2026-08-23.
watchPatterns = ["/apps/storefront/**", "/packages/**", "/infra/docker/**", "/pnpm-lock.yaml"]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# NEXT_PUBLIC_API_URL and NEXT_PUBLIC_DEV_TENANT_SLUG are compiled into the
# client bundle at BUILD time (Next.js behavior) — set them as Railway
# "Build Variables" on this service, not just runtime variables, or the
# Docker build args in infra/docker/storefront.Dockerfile won't pick them up.
# Attach your custom domain (or Railway's generated one) to this service —
# that Host is what apps/api's TenantMiddleware ultimately resolves the
# tenant from in production, once you move off NEXT_PUBLIC_DEV_TENANT_SLUG.
#
# NOTE on rebuilds after an env-var change: NEXT_PUBLIC_* are inlined at BUILD
# time, so changing NEXT_PUBLIC_DEV_TENANT_SLUG in Railway does NOT take effect
# until this service builds again. No commit changes when you edit a variable,
# so watchPatterns will never fire for it — trigger a redeploy by hand after
# changing one.
