# Railway service config for apps/api. In the Railway dashboard, create a
# service from this GitHub repo, set its "Config File Path" to
# apps/api/railway.toml (root directory stays the repo root — the
# Dockerfile path below is relative to repo root, not to this file).
# No Nixpacks: builder is pinned to DOCKERFILE.

[build]
builder = "DOCKERFILE"
dockerfilePath = "infra/docker/api.Dockerfile"
# The API's schema lives in packages/database, so a deploy must be triggered by
# changes there too — most importantly a new migration. The dashboard default
# was "/apps/api/**" alone, which means adding a migration would NOT redeploy
# the API and the schema would fall behind the code again. That is precisely
# the drift that took production down on 2026-08-23. infra/docker is included
# because it builds the image.
watchPatterns = ["/apps/api/**", "/packages/**", "/infra/docker/**", "/pnpm-lock.yaml"]

[deploy]
# Declared here rather than left to the dashboard. The release step
# (apps/api/start.sh) runs `prisma migrate deploy` and then the API; leaving the
# start command as dashboard-only configuration is how it ended up pointing at a
# path that turbo prune does not ship, failing three deploys in a row with
# "can't open 'scripts/start-api.sh'". Config-as-code makes it reviewable.
#
# Railway also supports `preDeployCommand`, which is the more idiomatic home for
# migrations (it runs once per deploy, before any new container serves traffic,
# and its failure fails the deploy). Worth moving to once there is a deploy to
# test it against — the wrapper below is equivalent at one replica and fails
# just as loudly, since the script exits non-zero if migrations fail.
startCommand = "sh apps/api/start.sh"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Required runtime variables (set in the Railway dashboard, not committed):
#   DATABASE_URL       — the OWNING role's connection string (Railway:
#                        ${{Postgres.DATABASE_URL}}). Used ONLY by the release
#                        step in infra/docker/api-entrypoint.sh, which runs
#                        `prisma migrate deploy` before the API starts. Without
#                        it the container refuses to boot — that is deliberate:
#                        a deploy that silently skips migrations is how the
#                        schema drifted 11 migrations behind the code in
#                        August 2026.
#   DATABASE_URL_APP   — rentos_app connection string (RLS-enforced role; see docs/HANDOFF.md)
#   REDIS_URL          — Railway Redis plugin reference variable
#   JWT_SECRET         — random 32+ byte secret
#   MESSAGING_PROVIDER — console_log | whatsapp_cloud
#   PAYMENT_PROVIDER   — mock | xendit
#   CORS_ORIGINS       — comma-separated storefront + console origins
# See .env.example for the full list, including optional Xendit/WhatsApp keys.
#
# Optional, one-shot:
#   SEED_ON_DEPLOY=true — runs `prisma db seed` after migrations, once. The seed
#                        is idempotent (upserts), but it re-asserts demo tenants
#                        and users, so set it for a single deploy and remove it.
